
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: car-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only runs on demand: docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: ETL/Dockerfile
    profiles: ["etl"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-./data}:/data:ro

volumes:
  postgres_data:
